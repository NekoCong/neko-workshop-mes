# ============================================================================
# 灵喵工坊 MES —— 生产环境编排（单机 Docker Compose）
#
# 与 docker-compose.local.yml（仅开发基础设施）的区别：
#   - 包含数据库/缓存/对象存储 + 后端 + 前端，全套服务一次拉起
#   - 全部使用 restart: unless-stopped，宿主机重启后自动恢复
#   - 数据保存在命名卷中，`down` 不会丢数据；只有 `down -v` 才会清空
#   - 只有前端 (80) 对外暴露，数据库/Redis/MinIO 仅在容器网络内可达
#
# 端口规划：
#   80   -> 前端 nginx（对外唯一入口，同时反代 /admin-api 与 /app-api）
#   48080-> 后端 Spring Boot（仅容器网络，不对外发布）
#   3306 -> MySQL      （仅容器网络）
#   6379 -> Redis      （仅容器网络）
#   9000 -> MinIO API  （仅容器网络）
#   9001 -> MinIO 控制台（可选对外，见 MINIO_CONSOLE_BIND）
#
# 镜像源：服务器直连 docker.io 会超时，因此统一走华为云 SWR 镜像。
# 如需切换，设置环境变量 REGISTRY_PREFIX（留空则用官方镜像）。
#
# 用法：
#   1) 准备产物（在仓库根目录执行）：
#        mvn -f neko-workshop-mes-server/pom.xml install -Dmaven.test.skip=true
#        cp neko-workshop-mes-server/neko-workshop-server/target/neko-workshop-server.jar \
#           deploy-prod/server/neko-workshop-server.jar
#        cd neko-workshop-mes-front && pnpm build:prod
#        cp -r dist ../deploy-prod/front/dist
#   2) 启动： docker compose -f docker-compose.prod.yml up -d --build
#   3) 查看： docker compose -f docker-compose.prod.yml ps
#             docker compose -f docker-compose.prod.yml logs -f mes-server
#   4) 停止（保留数据）： docker compose -f docker-compose.prod.yml down
#   5) 停止并清空数据：   docker compose -f docker-compose.prod.yml down -v
#
# 默认管理员： admin / 111111
# ============================================================================

name: mes-prod

x-common-env: &common-env
  TZ: Asia/Shanghai

services:
  # --------------------------------------------------------------------------
  # MySQL：MES 主库。库名由 MYSQL_DATABASE 决定，后端通过 MES_MYSQL_DATABASE 同步读取。
  # 首次启动（数据卷为空）时自动导入 deploy-prod/sql/init.sql 全量结构与数据。
  # --------------------------------------------------------------------------
  mysql:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/library/mysql:8.0.39"
    container_name: mes-mysql
    restart: unless-stopped
    environment:
      <<: *common-env
      MYSQL_ROOT_PASSWORD: "${MES_MYSQL_PASSWORD:-123456}"
      MYSQL_DATABASE: "${MES_MYSQL_DATABASE:-mes-core}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 使用 MySQL 原生认证，兼容旧客户端
      - --default-authentication-plugin=mysql_native_password
      # ACT_* / QRTZ_* / FLW_* 等大写表名与业务小写表名混存，必须保留大小写
      - --lower_case_table_names=0
      - "--sql-mode=IGNORE_SPACE,NO_ENGINE_SUBSTITUTION"
      - --max-connections=1000
    volumes:
      - mes-mysql-data:/var/lib/mysql
      # 仅当数据卷为空（首次启动）时执行，自动导入 MES 全量数据
      - ./deploy-prod/sql/init.sql:/docker-entrypoint-initdb.d/01-mes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - mes-network

  # --------------------------------------------------------------------------
  # Redis：缓存 / Token / 分布式锁。密码与后端 application-prod.yaml 保持一致。
  # --------------------------------------------------------------------------
  redis:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/library/redis:8-alpine"
    container_name: mes-redis
    restart: unless-stopped
    environment:
      <<: *common-env
    command:
      - redis-server
      - --port
      - "6379"
      - --requirepass
      - "${MES_REDIS_PASSWORD:-123456}"
      - --appendonly
      - "yes"
    volumes:
      - mes-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MES_REDIS_PASSWORD:-123456}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mes-network

  # --------------------------------------------------------------------------
  # MinIO：对象存储（框架文件上传 infra_file_config 指向 minio:9000）。
  # 数据卷挂载到 /data，与官方 minio 镜像一致。
  # --------------------------------------------------------------------------
  minio:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/minio/minio:RELEASE.2025-09-07T16-13-09Z"
    container_name: mes-minio
    restart: unless-stopped
    environment:
      <<: *common-env
      MINIO_ROOT_USER: "${MES_MINIO_ACCESS_KEY:-mesadmin}"
      MINIO_ROOT_PASSWORD: "${MES_MINIO_SECRET_KEY:-mesadmin123}"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - mes-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mes-network

  # --------------------------------------------------------------------------
  # 初始化 MinIO：创建 MES 所需的 bucket，并设置为可匿名下载。
  # 这是一次性任务（restart: "no"），完成后退出，不影响后续启停。
  # --------------------------------------------------------------------------
  minio-init:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/minio/mc:RELEASE.2025-08-13T08-35-41Z"
    container_name: mes-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *common-env
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set mes http://minio:9000 "${MES_MINIO_ACCESS_KEY:-mesadmin}" "${MES_MINIO_SECRET_KEY:-mesadmin123}"
        # MES 模块写死使用的 bucket
        mc mb --ignore-existing mes/mes
        # 框架默认文件配置使用的 bucket（infra_file_config）
        mc mb --ignore-existing mes/neko-workshop
        # 允许匿名读取，便于前端 <img> 直接展示
        mc anonymous set download mes/mes
        mc anonymous set download mes/neko-workshop
        echo "MinIO bucket 初始化完成"
    networks:
      - mes-network

  # --------------------------------------------------------------------------
  # 后端：Spring Boot（JDK 25），使用 prod profile。
  # 镜像在服务器上由 deploy-prod/server/neko-workshop-server.jar 构建。
  # --------------------------------------------------------------------------
  mes-server:
    container_name: mes-server
    build:
      context: ./deploy-prod
      dockerfile: Dockerfile
    image: mes-server:prod
    restart: unless-stopped
    environment:
      <<: *common-env
      # 强制使用 prod 配置，覆盖 jar 内默认的 dev
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms1024m -Xmx2048m -Djava.security.egd=file:/dev/./urandom"
      MES_MYSQL_HOST: mysql
      MES_MYSQL_PORT: "3306"
      MES_MYSQL_DATABASE: "${MES_MYSQL_DATABASE:-mes-core}"
      MES_MYSQL_USERNAME: root
      MES_MYSQL_PASSWORD: "${MES_MYSQL_PASSWORD:-123456}"
      MES_REDIS_HOST: redis
      MES_REDIS_PORT: "6379"
      MES_REDIS_PASSWORD: "${MES_REDIS_PASSWORD:-123456}"
    volumes:
      - mes-server-logs:/neko-workshop-server/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/48080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    networks:
      - mes-network

  # --------------------------------------------------------------------------
  # 前端：nginx 托管 dist，并把 /admin-api、/app-api 反代到后端。
  # 对外只暴露 80 端口。
  # --------------------------------------------------------------------------
  front:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/library/nginx:1.27-alpine"
    container_name: mes-front
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ./deploy-prod/front/dist:/usr/share/nginx/html:ro
      - ./deploy-prod/front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MES_FRONT_PORT:-80}:80"
    depends_on:
      mes-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mes-network

volumes:
  mes-mysql-data:
  mes-redis-data:
  mes-minio-data:
  mes-server-logs:

networks:
  mes-network:
    driver: bridge
