# 灵喵工坊 MES —— 生产环境 nginx 配置
#
# 前端 dist 打包时 VITE_BASE_URL='/'，接口路径自带 /admin-api、/app-api 前缀，
# 因此这里只需要：静态资源 + 两个接口前缀反向代理到后端 mes-server:48080。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 健康检查（供 compose healthcheck 使用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带 hash 的构建产物，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 管理端接口：/admin-api/xxx -> mes-server:48080/admin-api/xxx
    # proxy_pass 不带 URI，保留原始前缀原样转发
    location /admin-api/ {
        proxy_pass http://mes-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 移动端 / 开放接口
    location /app-api/ {
        proxy_pass http://mes-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 积木报表
    location /jmreport/ {
        proxy_pass http://mes-server:48080;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket
    location /websocket/ {
        proxy_pass http://mes-server:48080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
        proxy_read_timeout 3600s;
    }

    # 前端单页应用：找不到的路径统一回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
